# AI code reviewer — thin caller for the reusable workflow in axsy-skills.
# Installed from `.github/scripts/ai-review/install/caller.example.yml` in axsy-dev/axsy-skills.
#
# On-demand ONLY — it never runs on open/push, and never on a draft. It fires when a human either:
#   - requests the `ai-review` team from the Reviewers dropdown, or
#   - adds the `ai-review` label to the PR.
# A re-review is a fresh manual request: re-request the reviewer (or re-add the label).
#
# Pinned to the moving major tag `v1` in both places, so reviewer fixes arrive without a PR here.
name: ai-review

on:
  pull_request:
    types: [review_requested, labeled, ready_for_review]

# One review at a time per PR; don't cancel an in-flight review (it would lose its state write).
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    # Names the PR check. It is the only in-progress signal a developer sees while a review runs
    # (that, and the reviewer sitting pending in the Reviewers panel), so it should say what it is.
    name: ai-review
    # Off switch: set the repository variable AI_REVIEW_ENABLED to `false`. Don't instead drop the
    # repo from an org secret's access list — both are declared required, so runs fail, not skip.
    #
    # `ready_for_review` rescues a request made on a draft, which no-ops at the time. The label and a
    # pending reviewer request both survive that transition, so both are checked: covering only the
    # label would leave a requested reviewer pending forever, looking broken.
    if: >-
      vars.AI_REVIEW_ENABLED != 'false'
      && github.event.pull_request.draft == false
      && (
        (github.event.action == 'review_requested'
          && github.event.requested_team.slug == 'ai-review')
        || (github.event.action == 'labeled'
          && github.event.label.name == 'ai-review')
        || (github.event.action == 'ready_for_review'
          && (contains(github.event.pull_request.labels.*.name, 'ai-review')
              || contains(github.event.pull_request.requested_teams.*.slug, 'ai-review')))
      )
    # A caller's permissions are the CEILING for the workflow it calls, and `@v1` moves. Granting
    # exactly what the reviewer declares today means a future version that wants write access fails
    # here loudly, instead of silently inheriting whatever this repo's default token allows.
    permissions:
      contents: read
      pull-requests: read
      issues: read
    uses: axsy-dev/axsy-skills/.github/workflows/ai-review.yml@v1
    secrets: inherit
    with:
      pr_number: ${{ github.event.pull_request.number }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      repository: ${{ github.repository }}
      ai_review_ref: v1
      trigger: ${{ github.event.action }}
      # Acts as the axsy-ai-reviewer GitHub App, started by requesting the ai-review team (axsy-skills#107).
      reviewer_identity: app
      review_team: ai-review
